services:
  # Redis backing store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

  # The Backend Service (Express + WebSockets on one port, backed by Redis)
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ADMIN_KEY=change-me
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - app-network

  # The Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
